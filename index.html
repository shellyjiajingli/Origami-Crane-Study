<!doctype html>
<html lang="en">
<head>

<body>
<title>Origami Crane Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500&display=swap">
<style>
  /* Layout: a white studio table; the sheet sits in the middle, type is pinned to the corners like a drawing title block. */
  :root {
    --ground: #ffffff;
    --ink: #111112;
    --graphite: #6f6f72;
    --pencil: #b9b9bc;
    --trace: #e4e4e6;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --cond: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); overflow: hidden; font-family: var(--mono); -webkit-font-smoothing: antialiased; }
  #gl, #ov { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { touch-action: none; }
  #ov { pointer-events: none; }

  .hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 28px); left: 32px; right: 32px; pointer-events: none; display: grid; gap: 10px; max-width: 34rem; }
  .kicker { font-size: 11px; letter-spacing: .16em; color: var(--graphite); }
  .kicker b { font-weight: 500; color: var(--ink); }
  .stepline { font-size: 11px; letter-spacing: .16em; display: flex; align-items: baseline; gap: .6em; font-variant-numeric: tabular-nums; }
  .stepline .of { color: var(--pencil); }
  .instr { font-family: var(--cond); font-weight: 500; font-size: clamp(19px, 2.2vw, 24px); letter-spacing: .06em; line-height: 1.15; text-wrap: balance; margin-top: 6px; }
  .note { font-size: 10.5px; letter-spacing: .14em; color: var(--graphite); line-height: 1.5; min-height: 1.5em; }
  .hint { font-size: 10.5px; letter-spacing: .12em; color: var(--ink); display: flex; gap: .7em; align-items: center; margin-top: 4px; }
  .hint::before { content: ""; width: 7px; height: 7px; border: 1.3px solid var(--ink); border-radius: 50%; background: var(--ground); flex: none; }
  .ticks { display: flex; gap: 4px; align-items: flex-end; height: 12px; margin-top: 2px; }
  .ticks i { width: 1px; height: 7px; background: var(--trace); }
  .ticks i.d { background: var(--ink); }
  .ticks i.c { height: 12px; background: var(--ink); width: 2px; }
  .ticks i.p { background: var(--trace); height: 4px; }

  .phase { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 30px); right: 32px; font-size: 10px; letter-spacing: .16em; color: var(--pencil); pointer-events: none; display: flex; gap: .55em; }
  .phase span[data-p].on { color: var(--ink); font-weight: 500; }

  .cpbox { position: fixed; right: 32px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); width: 92px; margin: 0; pointer-events: none; display: grid; gap: 8px; }
  .cpbox svg { width: 92px; height: 92px; overflow: visible; }
  .cpbox figcaption { font-size: 9.5px; letter-spacing: .16em; color: var(--graphite); }
  .cp-sheet { fill: none; stroke: var(--ink); stroke-width: .016; }
  .cp-made { stroke: var(--graphite); stroke-width: .011; }
  .cp-next { stroke: var(--ink); stroke-width: .013; stroke-dasharray: .06 .05; }

  .ctrl { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 26px); display: flex; justify-content: center; gap: clamp(8px, 5vw, 64px); flex-wrap: wrap; }
  .ctrl button { font: 500 11px/1 var(--mono); letter-spacing: .14em; color: var(--ink); background: var(--ground); border: 0; padding: 10px 4px; cursor: pointer; white-space: nowrap; }
  .ctrl button::before { content: "[ "; color: var(--pencil); }
  .ctrl button::after { content: " ]"; color: var(--pencil); }
  .ctrl button:disabled { color: var(--pencil); cursor: default; }
  .ctrl button:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  .ctrl button:not(:disabled):hover { text-decoration: underline; text-underline-offset: 4px; }
  #next.is-ready::before, #next.is-ready::after { color: var(--ink); }
  #next.is-ready::after { animation: ready 1.6s ease-in-out infinite; }
  @keyframes ready { 50% { opacity: .25; } }

  .fin { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%); text-align: center; font-size: 11px; letter-spacing: .3em; line-height: 2; pointer-events: none; }
  .hud.is-complete { visibility: hidden; }

  @media (max-width: 640px) {
    .hud { left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 18px); }
    .phase { display: none; }
    .cpbox { right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); width: 64px; }
    .cpbox svg { width: 64px; height: 64px; }
    .cpbox figcaption { display: none; }
    .ctrl { gap: 6px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
    .ctrl button { font-size: 10px; letter-spacing: .08em; }
  }
  @media (prefers-reduced-motion: reduce) { #next.is-ready::after { animation: none; } }
</style>

  <div class="hint" id="hint">DRAG THE MARKED CORNER ALONG THE DOTTED PATH · DRAG EMPTY SPACE TO ORBIT</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   OrigamiGeometry
   Paper lives in 2D "paper space" (u,v) on the square [-1,1]^2.
   P3() lifts a paper point into the 3D rest frame: (u, 0, -v).
   Facets are the convex cells of the full crease pattern; each facet
   carries a rigid transform M (rest frame -> world) and a layer index.
   ===================================================================== */
const OrigamiGeometry = (() => {
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const cross = (a, b) => a[0] * b[1] - a[1] * b[0];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const P3 = (p) => new THREE.Vector3(p[0], 0, -p[1]);

  function onSegment(p, a, b, tol = 1e-6) {
    const ab = sub(b, a), ap = sub(p, a), L = Math.hypot(ab[0], ab[1]);
    if (Math.abs(cross(ab, ap)) / L > tol) return false;
    const t = dot(ap, ab) / (L * L);
    return t >= -tol && t <= 1 + tol;
  }

  // Split a convex polygon by the crease segment a-b, only if the chord
  // the line cuts through the polygon lies on the segment itself.
  function splitPoly(poly, a, b) {
    const L0 = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const s = poly.map((p) => { const v = cross(sub(b, a), sub(p, a)) / L0; return Math.abs(v) < 1e-9 ? 0 : v; });
    if (s.every((v) => v >= 0) || s.every((v) => v <= 0)) return null;
    const left = [], right = [], chord = [];
    for (let i = 0; i < poly.length; i++) {
      const j = (i + 1) % poly.length, p = poly[i], q = poly[j], sp = s[i], sq = s[j];
      if (sp >= 0) left.push(p);
      if (sp <= 0) right.push(p);
      if (sp === 0) chord.push(p);
      if (sp * sq < 0) {
        const t = sp / (sp - sq), x = [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
        left.push(x); right.push(x); chord.push(x);
      }
    }
    if (chord.length < 2 || !chord.every((c) => onSegment(c, a, b))) return null;
    return [left, right];
  }

  function centroid(poly) {
    let x = 0, y = 0; poly.forEach((p) => { x += p[0]; y += p[1]; });
    return [x / poly.length, y / poly.length];
  }

  // convex containment, boundary inclusive
  function inConvex(p, poly, tol = 1e-6) {
    let sgn = 0;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const c = cross(sub(b, a), sub(p, a)) / L;
      if (Math.abs(c) < tol) continue;
      const sg = Math.sign(c);
      if (sgn === 0) sgn = sg; else if (sg !== sgn) return false;
    }
    return true;
  }

  // general (ray-cast) containment for region selectors
  function inPoly(p, poly) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > p[1]) !== (yj > p[1]) && p[0] < ((xj - xi) * (p[1] - yi)) / (yj - yi) + xi) c = !c;
    }
    return c;
  }

  function buildFacets(creases) {
    let polys = [[[-1, -1], [1, -1], [1, 1], [-1, 1]]];
    for (const c of creases) {
      const next = [];
      for (const p of polys) { const r = splitPoly(p, c.a, c.b); if (r) next.push(r[0], r[1]); else next.push(p); }
      polys = next;
    }
    return polys.map((poly, id) => {
      const edges = poly.map((p, k) => {
        const q = poly[(k + 1) % poly.length];
        let type = null;
        for (const c of creases) if (onSegment(p, c.a, c.b) && onSegment(q, c.a, c.b)) { type = c.id; break; }
        if (!type) {
          const bd = (i) => (Math.abs(Math.abs(p[i]) - 1) < 1e-9 && Math.abs(p[i] - q[i]) < 1e-9);
          type = bd(0) || bd(1) ? 'boundary' : 'none';
        }
        return { p, q, type };
      });
      return { id, poly, centroid: centroid(poly), edges };
    });
  }

  // rigid transform carrying source triangle (Vector3 x3) onto target triangle
  function fitRigid(src, dst) {
    const frame = (p) => {
      const e1 = p[1].clone().sub(p[0]).normalize();
      const e3 = new THREE.Vector3().crossVectors(e1, p[2].clone().sub(p[0])).normalize();
      const e2 = new THREE.Vector3().crossVectors(e3, e1);
      return new THREE.Matrix4().makeBasis(e1, e2, e3);
    };
    const Fs = frame(src), Ft = frame(dst);
    return new THREE.Matrix4().makeTranslation(dst[0].x, dst[0].y, dst[0].z)
      .multiply(Ft).multiply(Fs.transpose())
      .multiply(new THREE.Matrix4().makeTranslation(-src[0].x, -src[0].y, -src[0].z));
  }

  return { P3, onSegment, splitPoly, centroid, inConvex, inPoly, buildFacets, fitRigid };
})();

/* =====================================================================
   FoldEngine
   Compiles a model (crease list + FoldStep data) into a chain of states
   and evaluates any step at any progress t in [0,1] as a "pose":
   { M: Matrix4[] per facet, off: Vector3[] layer offsets }.
   Motion types: 'hinge' (rigid rotation about a crease line),
   'collapse' (rigid-foldable square/preliminary base), and a turn-over.
   ===================================================================== */
class FoldEngine {
  constructor(model, opts = {}) {
    this.model = model;
    this.gap = opts.layerGap ?? 0.0012;
    this.steps = model.steps;
    this.live = this.steps.filter((s) => s.motion).length; // implemented steps lead the list
    // world-space creases are mapped back onto paper. Each pass accepts the
    // new cuts of the earliest step that still has any, then rebuilds.
    const extra = [];
    for (let pass = 0; pass < 40; pass++) {
      this.creases = [...model.creases, ...extra];
      this.facets = OrigamiGeometry.buildFacets(this.creases);
      this.pending = [];
      try { this.compile(); } catch (err) { if (!this.pending.length) throw err; }
      if (!this.pending.length) break;
      const first = Math.min(...this.pending.map((d) => this.indexOfId(d.step)));
      const sid = this.steps[first].id;
      this.pending.filter((d) => d.step === sid).forEach((d) => {
        extra.push({ ...d, id: `${sid}~${extra.filter((e) => e.step === sid).length}` });
      });
    }
    this.derived = extra;
    this.creases = [...model.creases, ...extra];
    this.stepCreases = this.steps.map((s) => [...(s.creases || []), ...this.derived.filter((d) => d.step === s.id).map((d) => d.id)]);
  }

  initialState() {
    return { M: this.facets.map(() => new THREE.Matrix4()), L: this.facets.map(() => 0) };
  }

  static compress(L) {
    const vals = [...new Set(L)].sort((a, b) => a - b);
    const map = new Map(vals.map((v, i) => [v, i]));
    return L.map((v) => map.get(v));
  }

  indexOfId(id) { return this.steps.findIndex((s) => s.id === id); }

  compile() {
    let s = this.initialState();
    this.entry = []; this.ready = []; this.done = []; this.ctx = []; this.paths = []; this.movedBy = {};
    for (let i = 0; i < this.live; i++) {
      const step = this.steps[i];
      this.entry[i] = s;
      const r = step.turnOver ? this.flipFinal(s) : s;
      this.ready[i] = r;
      const ctx = this.prepare(step, r);
      this.ctx[i] = ctx;
      const path = [{ step: i, from: 0, to: 1 }];
      let fin = ctx.final;
      if (step.unfold) {
        const list = step.unfold === true ? [step.id] : step.unfold;
        for (const id of list) { const j = this.indexOfId(id); path.push({ step: j, from: 1, to: 0 }); fin = this.ready[j]; }
      }
      this.paths[i] = path;
      this.done[i] = fin;
      s = fin;
    }
  }

  prepare(step, base) {
    const type = step.motion.type;
    const ctx = type === 'collapse' ? this.prepareCollapse(step, base) : type === 'petal' ? this.preparePetal(step, base) : this.prepareHinge(step, base);
    if (ctx.moving) this.movedBy[step.id] = ctx.moving;
    let hp = step.handle.point;
    if (step.handle.world) {
      // a world point on the table: take the topmost moving facet under it
      const [x, z] = step.handle.world;
      let best = -1, bl = -Infinity;
      (ctx.moving ? [...ctx.moving] : this.facets.map((f) => f.id)).forEach((i) => {
        const wp = this.worldPoly(i, base).map((p) => [p.x, p.z]);
        if (OrigamiGeometry.inConvex([x, z], wp, 1e-6) && base.L[i] > bl) { bl = base.L[i]; best = i; }
      });
      if (best < 0) best = [...ctx.moving][0];
      if (best === undefined) throw new Error(`step ${step.id}: nothing moves`);
      const q = new THREE.Vector3(x, 0, z).applyMatrix4(base.M[best].clone().invert());
      hp = [q.x, -q.z];
      ctx.handleFacet = best;
    } else {
      const cands = this.facets.filter((f) => OrigamiGeometry.inConvex(hp, f.poly)).map((f) => f.id);
      ctx.handleFacet = cands.find((i) => !ctx.moving || ctx.moving.has(i)) ?? cands[0];
    }
    ctx.handlePoint = hp;
    ctx.handleAt = (t) => this.pointInPose(ctx.eval(t), ctx.handleFacet, hp);
    return ctx;
  }

  pointInPose(pose, i, p) {
    return OrigamiGeometry.P3(p).applyMatrix4(pose.M[i]).add(pose.off[i]);
  }

  statePose(state) {
    return { M: state.M, off: state.L.map((l) => new THREE.Vector3(0, l * this.gap, 0)) };
  }

  // world position of a paper point, taken from the topmost facet holding it
  worldOnTop(p, pose, L) {
    let best = -1, bl = -Infinity;
    this.facets.forEach((f, i) => { if (OrigamiGeometry.inConvex(p, f.poly) && L[i] > bl) { bl = L[i]; best = i; } });
    return this.pointInPose(pose, best, p);
  }

  worldOf(p, state, subset) {
    for (const i of subset) if (OrigamiGeometry.inConvex(p, this.facets[i].poly)) return OrigamiGeometry.P3(p).applyMatrix4(state.M[i]);
    throw new Error('paper point not found in facets: ' + p);
  }

  /* ---------- hinge: rotate facet sets about crease lines ----------
     A step may hold several simultaneous folds (e.g. both edges at once).
     Each fold's crease is given either in paper space (axis) or in world
     space (worldAxis, on the flat table plane): a world crease cuts every
     selected layer, and the engine maps it back onto each facet's paper. */
  sectorOf(f) { let a = Math.atan2(f.centroid[1], f.centroid[0]); if (a < 0) a += 2 * Math.PI; return Math.floor(a / (Math.PI / 4)) % 8; }

  worldPoly(i, state) { return this.facets[i].poly.map((p) => OrigamiGeometry.P3(p).applyMatrix4(state.M[i])); }

  selectFold(fold, base, step) {
    const F = this.facets;
    const polys = fold.moving ? (Array.isArray(fold.moving[0][0]) ? fold.moving : [fold.moving]) : null;
    if (!fold.worldAxis) {
      return new Set(F.filter((f) => polys.some((pl) => OrigamiGeometry.inPoly(f.centroid, pl))).map((f) => f.id));
    }
    const [a, b] = fold.worldAxis; // [x,z] pairs
    const side = (x, z) => (b[0] - a[0]) * (z - a[1]) - (b[1] - a[1]) * (x - a[0]);
    const tipSign = Math.sign(side(fold.tip[0], fold.tip[1]));
    const cand = F.filter((f) => {
      if (fold.sectors && !fold.sectors.includes(this.sectorOf(f))) return false;
      if (fold.exclude && fold.exclude.some((id) => this.movedBy[id] && this.movedBy[id].has(f.id))) return false;
      if (fold.region) {
        const c = OrigamiGeometry.P3(f.centroid).applyMatrix4(base.M[f.id]);
        const touches = OrigamiGeometry.inPoly([c.x, c.z], fold.region) || this.worldPoly(f.id, base).some((p) => OrigamiGeometry.inPoly([p.x, p.z], fold.region));
        if (!touches) return false;
      }
      return true;
    });
    const inRegion = (f) => {
      if (!fold.region) return true;
      const c = OrigamiGeometry.P3(f.centroid).applyMatrix4(base.M[f.id]);
      return OrigamiGeometry.inPoly([c.x, c.z], fold.region);
    };
    // derive the paper crease inside every candidate facet the world line cuts
    for (const f of cand) {
      const wp = this.worldPoly(f.id, base), sd = wp.map((p) => side(p.x, p.z));
      const L0 = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const pts = [];
      for (let k = 0; k < wp.length; k++) {
        const j = (k + 1) % wp.length, s1 = sd[k] / L0, s2 = sd[j] / L0;
        if (Math.abs(s1) < 1e-7) pts.push(wp[k]);
        else if (s1 * s2 < 0 && Math.abs(s2) >= 1e-7) pts.push(wp[k].clone().lerp(wp[j], s1 / (s1 - s2)));
      }
      if (pts.length < 2 || !(sd.some((v) => v / L0 > 1e-7) && sd.some((v) => v / L0 < -1e-7))) continue;
      const inv = base.M[f.id].clone().invert();
      const pp = pts.slice(0, 2).map((p) => { const q = p.clone().applyMatrix4(inv); return [q.x, -q.z]; });
      if (Math.hypot(pp[0][0] - pp[1][0], pp[0][1] - pp[1][1]) < 1e-6) continue;
      this.pending.push({ step: step.id, a: pp[0], b: pp[1], kind: 'derived' });
    }
    return new Set(cand.filter((f) => {
      if (!inRegion(f)) return false;
      const c = OrigamiGeometry.P3(f.centroid).applyMatrix4(base.M[f.id]);
      return Math.sign(side(c.x, c.z)) === tipSign;
    }).map((f) => f.id));
  }

  prepareHinge(step, base) {
    const F = this.facets, gap = this.gap;
    const folds = (step.motion.folds || [step.motion]).map((fold) => {
      const moving = this.selectFold(fold, base, step);
      const still = F.map((f) => f.id).filter((i) => !moving.has(i));
      let A, B;
      if (fold.worldAxis) { A = new THREE.Vector3(fold.worldAxis[0][0], 0, fold.worldAxis[0][1]); B = new THREE.Vector3(fold.worldAxis[1][0], 0, fold.worldAxis[1][1]); }
      else { A = this.worldOf(fold.axis[0], base, still); B = this.worldOf(fold.axis[1], base, still); }
      const u = B.clone().sub(A).normalize();
      const c = new THREE.Vector3();
      moving.forEach((i) => c.add(OrigamiGeometry.P3(F[i].centroid).applyMatrix4(base.M[i])));
      c.divideScalar(Math.max(1, moving.size));
      const r = c.clone().sub(A); r.addScaledVector(u, -r.dot(u));
      const dir = fold.direction === 'mountain' ? -1 : 1;
      if (new THREE.Vector3().crossVectors(u, r).y * dir < 0) u.negate();
      return { fold, moving, A, u, dir, angle: ((fold.angle ?? 180) * Math.PI) / 180 };
    });
    // final stacking
    let Lraw = base.L.slice();
    for (const f of folds) {
      const ids = [...f.moving];
      if (!ids.length) continue;
      const movL = ids.map((i) => Lraw[i]);
      const maxAll = Math.max(...Lraw), minAll = Math.min(...Lraw), maxMov = Math.max(...movL), minMov = Math.min(...movL);
      if (f.fold.layering === 'inside') {
        // inside-reverse: each half of the flap tucks just inside its own side
        const mid = (maxMov + minMov) / 2;
        ids.forEach((i) => { Lraw[i] = Lraw[i] + (Lraw[i] > mid ? -0.5 : 0.5); });
      } else if (f.fold.layering === 'keep') {
        /* stays in place */
      } else {
        ids.forEach((i) => { Lraw[i] = f.dir > 0 ? maxAll + 1 + (maxMov - Lraw[i]) : minAll - 1 - (Lraw[i] - minMov); });
      }
    }
    const Lb = base.L, Lf = FoldEngine.compress(Lraw);
    const evalT = (t) => {
      const M = base.M.slice();
      for (const f of folds) {
        const G = new THREE.Matrix4().makeTranslation(f.A.x, f.A.y, f.A.z)
          .multiply(new THREE.Matrix4().makeRotationAxis(f.u, f.angle * t))
          .multiply(new THREE.Matrix4().makeTranslation(-f.A.x, -f.A.y, -f.A.z));
        f.moving.forEach((i) => { M[i] = G.clone().multiply(base.M[i]); });
      }
      return { M, off: F.map((f, i) => new THREE.Vector3(0, (Lb[i] + (Lf[i] - Lb[i]) * t) * gap, 0)) };
    };
    const moving = new Set(); folds.forEach((f) => f.moving.forEach((i) => moving.add(i)));
    const end = evalT(1);
    return { eval: evalT, moving, final: { M: end.M, L: Lf } };
  }

  /* ---------- petal fold: the front layer's corner lifts about a
     horizontal crease; each side folds in about its kite crease while the
     piece joining them is solved so every hinge stays connected. -------- */
  preparePetal(step, base) {
    const m = step.motion, F = this.facets, gap = this.gap, V3 = THREE.Vector3;
    const inP = (pl) => new Set(F.filter((f) => OrigamiGeometry.inPoly(f.centroid, pl)).map((f) => f.id));
    const center = inP(m.center);
    const all = F.map((f) => f.id);
    const W = (p, set) => this.worldOf(p, base, set ? [...set] : all);
    const Pa = W(m.axis[0]), Pb = W(m.axis[1]), Cw = W(m.apex, center);
    const rotAbout = (A, u, ang) => new THREE.Matrix4().makeTranslation(A.x, A.y, A.z).multiply(new THREE.Matrix4().makeRotationAxis(u, ang)).multiply(new THREE.Matrix4().makeTranslation(-A.x, -A.y, -A.z));
    const upAxis = (A, B, probe) => {
      const u = B.clone().sub(A).normalize(); const r = probe.clone().sub(A); r.addScaledVector(u, -r.dot(u));
      if (new V3().crossVectors(u, r).y < 0) u.negate(); return u;
    };
    const uc = upAxis(Pa, Pb, Cw);
    const sides = m.sides.map((sd) => {
      const top = inP(sd.top), under = inP(sd.under);
      const Pw = W(sd.pivot), Mw = W(sd.corner, top), Dw = W(sd.hidden, under);
      const uh = upAxis(Dw, Pw, Mw);
      return { top, under, Pw, Mw, Dw, uh, d0: Mw.distanceTo(Cw), last: 0 };
    });
    const solve = (sd, th) => {
      const C = Cw.clone().applyMatrix4(rotAbout(Pa, uc, th));
      const f = (ph) => sd.Mw.clone().applyMatrix4(rotAbout(sd.Pw, sd.uh, ph)).distanceTo(C) - sd.d0;
      const N = 180; let best = null;
      let prev = f(0);
      if (Math.abs(prev) < 1e-9) best = 0;
      for (let k = 1; k <= N; k++) {
        const ph = (Math.PI * k) / N, v = f(ph);
        if (prev * v <= 0) {
          let lo = (Math.PI * (k - 1)) / N, hi = ph, flo = prev;
          for (let it = 0; it < 40; it++) { const md = (lo + hi) / 2, fm = f(md); if (flo * fm <= 0) hi = md; else { lo = md; flo = fm; } }
          const r = (lo + hi) / 2;
          if (best === null || Math.abs(r - th) < Math.abs(best - th)) best = r;
        }
        prev = v;
      }
      return best === null ? th : best;
    };
    // stacking: hidden pieces, then the joining pieces, then the lifted petal on top
    const Lraw = base.L.slice();
    let cur = Math.max(...Lraw) + 1;
    const groups = [sides.flatMap((s) => [...s.under]), sides.flatMap((s) => [...s.top]), [...center]];
    for (const g of groups) {
      const mn = Math.min(...g.map((i) => base.L[i]));
      let mx = cur;
      g.forEach((i) => { Lraw[i] = cur + (base.L[i] - mn); mx = Math.max(mx, Lraw[i]); });
      cur = mx + 1;
    }
    const Lb = base.L, Lf = FoldEngine.compress(Lraw);
    const evalT = (t) => {
      const th = Math.PI * t;
      const M = base.M.slice();
      const Rc = rotAbout(Pa, uc, th);
      center.forEach((i) => { M[i] = Rc.clone().multiply(base.M[i]); });
      const C = Cw.clone().applyMatrix4(Rc);
      for (const sd of sides) {
        const ph = t <= 0 ? 0 : t >= 1 ? Math.PI : solve(sd, th);
        const Rh = rotAbout(sd.Pw, sd.uh, ph);
        sd.under.forEach((i) => { M[i] = Rh.clone().multiply(base.M[i]); });
        const Fit = OrigamiGeometry.fitRigid([sd.Pw, sd.Mw, Cw], [sd.Pw, sd.Mw.clone().applyMatrix4(Rh), C]);
        sd.top.forEach((i) => { M[i] = Fit.clone().multiply(base.M[i]); });
      }
      return { M, off: F.map((f, i) => new V3(0, (Lb[i] + (Lf[i] - Lb[i]) * t) * gap, 0)) };
    };
    const moving = new Set([...center]); sides.forEach((s) => { s.top.forEach((i) => moving.add(i)); s.under.forEach((i) => moving.add(i)); });
    const end = evalT(1);
    return { eval: evalT, moving, final: { M: end.M, L: Lf } };
  }

  /* ---------- collapse: symmetric rigid folding of the degree-8 vertex
     at the sheet centre (diagonals valley, midlines mountain), then the
     four wings pair up and the base is laid flat on the table. -------- */
  prepareCollapse(step, base) {
    const F = this.facets, V3 = THREE.Vector3, Q = Math.PI / 4, gap = this.gap;
    const sm = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
    const sector = F.map((f) => { let a = Math.atan2(f.centroid[1], f.centroid[0]); if (a < 0) a += 2 * Math.PI; return Math.floor(a / Q) % 8; });
    const len = (j) => (j % 2 === 0 ? 1 : Math.SQRT2);
    const ray2 = (j) => [Math.cos(j * Q) * len(j), Math.sin(j * Q) * len(j)];
    const src = [...Array(8)].map((_, j) => [[0, 0], ray2(j), ray2((j + 1) % 8)].map(OrigamiGeometry.P3));
    const dirOf = (e, ph) => new V3(Math.sin(e) * Math.cos(ph), -Math.cos(e), -Math.sin(e) * Math.sin(ph));
    const WING = [1, -1, 1, -1].map((s) => s * Q); // wings 0,90 -> 45 ; 180,270 -> 225
    // midline elevation a given diagonal elevation b (adjacent rays stay 45deg apart)
    const aOf = (b) => { const A = Math.SQRT1_2 * Math.sin(b), B = Math.cos(b), R = Math.hypot(A, B); return Math.PI - Math.asin(Math.min(1, Math.SQRT1_2 / R)) - Math.atan2(B, A); };
    const tri = (j, b, s2) => {
      const pts = [new V3()];
      for (const k of [j, (j + 1) % 8]) {
        const ph = k * Q;
        if (k % 2 === 0) pts.push(s2 > 0 ? dirOf(Q, ph + WING[k / 2] * s2) : dirOf(aOf(b), ph));
        else pts.push(s2 > 0 ? new V3(0, -Math.SQRT2, 0) : dirOf(b, ph).multiplyScalar(Math.SQRT2));
      }
      return pts;
    };
    const wingOf = (j) => (j % 2 === 0 ? j / 2 : ((j + 1) / 2) % 4);

    const layFlat = (sigma) => {
      const h = dirOf(Math.PI / 2, Q);
      const a2 = new V3().crossVectors(h, new V3(0, 1, 0)).normalize().multiplyScalar(sigma);
      const a3 = new V3(0, -1, 0), a1 = new V3().crossVectors(a2, a3);
      const R = new THREE.Matrix4().set(a1.x, a1.y, a1.z, 0, a2.x, a2.y, a2.z, 0, a3.x, a3.y, a3.z, 0, 0, 0, 0, 1);
      return { R, q: new THREE.Quaternion().setFromRotationMatrix(R), n: a2 };
    };
    // stacking order: probe the motion just before it goes flat
    const probe = (sigma) => {
      const { R } = layFlat(sigma);
      const ys = [...Array(8)].map((_, j) => {
        const rot = new THREE.Matrix4().makeRotationY(WING[wingOf(j)] * 0.9);
        const c = new V3(); tri(j, 0.008, 0).forEach((p) => c.add(p.applyMatrix4(rot)));
        return c.applyMatrix4(R).y;
      });
      const order = ys.map((y, j) => [y, j]).sort((a, b) => a[0] - b[0]);
      const rank = []; order.forEach(([, j], r) => (rank[j] = r));
      return rank;
    };
    const up = step.motion.faceUp || [0.5, -0.5];
    const upSector = sector[F.find((f) => OrigamiGeometry.inConvex(up, f.poly)).id];
    let sigma = 1, rank = probe(1);
    if (rank[upSector] !== 7) { sigma = -1; rank = probe(-1); }
    const { q: qF, n } = layFlat(sigma);
    const Lf = F.map((f, i) => rank[sector[i]]);
    const tF = new V3(0, 0, -Math.SQRT2 / 2), q0 = new THREE.Quaternion();

    const evalT = (t) => {
      const s1 = sm(t / 0.55), s2 = sm((t - 0.55) / 0.27), s3 = sm((t - 0.45) / 0.55);
      const b = (Math.PI / 2) * (1 - s1);
      const q = q0.clone().slerp(qF, s3);
      const G = new THREE.Matrix4().compose(tF.clone().multiplyScalar(s3), q, new V3(1, 1, 1));
      const nW = n.clone().applyQuaternion(q), so = sm((t - 0.3) / 0.7);
      const fits = [...Array(8)].map((_, j) => G.clone().multiply(OrigamiGeometry.fitRigid(src[j], tri(j, b, s2))));
      return {
        M: F.map((f, i) => fits[sector[i]]),
        off: F.map((f, i) => nW.clone().multiplyScalar(Lf[i] * gap * so)),
      };
    };
    const end = evalT(1);
    return { eval: evalT, moving: null, final: { M: end.M, L: Lf } };
  }

  /* ---------- turn over: rotate the whole sheet about the world Z axis ---------- */
  flipPose(state, t) {
    const R = new THREE.Matrix4().makeRotationZ(Math.PI * t);
    const G = new THREE.Matrix4().makeTranslation(0, Math.sin(Math.PI * t) * 0.55, 0).multiply(R);
    return {
      M: state.M.map((m) => G.clone().multiply(m)),
      off: state.L.map((l) => new THREE.Vector3(0, l * this.gap, 0).applyMatrix4(R)),
    };
  }
  flipFinal(state) {
    const R = new THREE.Matrix4().makeRotationZ(Math.PI);
    return { M: state.M.map((m) => R.clone().multiply(m)), L: FoldEngine.compress(state.L.map((l) => -l)) };
  }
}

   Paper space: square [-1,1]^2, +u right, +v away from the viewer.
   Every crease used anywhere in the model is listed once; the engine

   only becomes visible once the step that makes it has been folded.

  function prev() {
    if (busy()) return;
    if (S.complete) { S.complete = false; stand.goal = 0; camCtl.spin = 0; ui.hud.classList.remove('is-complete'); ui.fin.hidden = true; }
    if (!isLive(S.i)) { enterStep(LIVE - 1, false); S.done[LIVE - 1] = true; guide.alphaGoal = 0; refreshUI(); return; }
    guide.alphaGoal = 0;
    if (S.done[S.i]) {
      const i = S.i;
      S.mode = 'anim'; S.done[i] = false;
      queue([...rewindItems(i), { kind: 'call', fn: () => { S.mode = 'idle'; S.t = 0; setCamera(i); guide.build(i); guide.alphaGoal = 1; refreshUI(); } }]);
      refreshUI();
      return;
    }
    if (S.i === 0) return;
    const i = S.i, j = i - 1;
    S.mode = 'anim';
    const items = [];
    if (STEPS[i].turnOver) items.push({ kind: 'flip', step: i, from: 1, to: 0, dur: reduceMotion ? 0.4 : 1.1 });
    items.push({ kind: 'call', fn: () => { S.i = j; S.done[j] = false; S.t = 0; setCamera(j); refreshUI(); } });
    items.push(...rewindItems(j));
    items.push({ kind: 'call', fn: () => { S.mode = 'idle'; S.t = 0; guide.build(j); guide.alphaGoal = 1; refreshUI(); } });
    // until the step index flips, keep showing the done state of j
    S.done[j] = true;
    queue(items);
  }

  function startCompletion() {
    S.complete = true;
    guide.alphaGoal = 0;
    ui.hud.classList.add('is-complete'); ui.fin.hidden = false;
    stand.goal = 1;
    camCtl.setGoal({ az: 64, el: 16, dist: 9.6, target: [0, 0.35, 0], fold: { az: 0, el: 0 } });
    setTimeout(() => { camCtl.spin = reduceMotion ? 0 : 7; }, 2600);
    setTimeout(() => { camCtl.spin = 0; }, 22000);
  }

  /* crease-pattern diagram (paper space, y flipped for SVG) */
  function drawCP() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = ui.cp;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const line = (a, b, cls) => {
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', a[0]); l.setAttribute('y1', -a[1]); l.setAttribute('x2', b[0]); l.setAttribute('y2', -b[1]);
      l.setAttribute('class', cls); svg.appendChild(l);
    };
    const made = new Set();
    for (let j = 0; j < Math.min(LIVE, MODEL.total); j++) if (j < S.i || S.done[j]) engine.stepCreases[j].forEach((c) => made.add(c));
    engine.creases.forEach((c) => { if (made.has(c.id)) line(c.a, c.b, 'cp-made'); });
    if (isLive(S.i) && !S.done[S.i]) engine.stepCreases[S.i].forEach((id) => { if (!made.has(id)) { const c = engine.creases.find((x) => x.id === id); line(c.a, c.b, 'cp-next'); } });
    const r = document.createElementNS(ns, 'rect');
    r.setAttribute('x', -1); r.setAttribute('y', -1); r.setAttribute('width', 2); r.setAttribute('height', 2); r.setAttribute('class', 'cp-sheet');
    svg.appendChild(r);
  }

  function refreshUI() {
    const step = STEPS[S.i];
    ui.stepNo.textContent = String(step.id).padStart(2, '0');
    ui.title.textContent = step.title;
    let note = step.note || '';
    ui.note.textContent = note;
    ui.hint.hidden = !(S.i === 0 && !S.everFolded);
    ui.next.disabled = !(isLive(S.i) && S.done[S.i] && S.i + 1 < MODEL.total) || S.complete;
    ui.next.classList.toggle('is-ready', !ui.next.disabled);
    ui.prev.disabled = S.i === 0 && !S.done[0];
    [...ui.ticks.children].forEach((el, k) => {
      el.className = k < S.i || (k === S.i && S.done[k]) ? 'd' : k === S.i ? 'c' : k < LIVE ? '' : 'p';
    });
    ui.phases.forEach((el) => el.classList.toggle('on', el.dataset.p === step.phase));
    drawCP();
  }

  ui.next.addEventListener('click', next);
  ui.prev.addEventListener('click', prev);
  ui.reset.addEventListener('click', () => { camCtl.spin = 0; setCamera(S.i); });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'Enter') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'r' || e.key === 'R') setCamera(S.i);
  });

  /* ---------------- InteractionController ---------------- */
  const IC = { pointer: null, grab: [0, 0], orbit: null, hovered: false, pinch: null, pts: new Map() };
  const handleScreen = () => toScreen(guide.data.traj[Math.round(S.t * (guide.data.traj.length - 1))]);
  const canFold = () => isLive(S.i) && !S.done[S.i] && !busy() && guide.data && guide.data.i === S.i && !S.complete;
  function distToSeg(p, a, b) {
    const vx = b[0] - a[0], vy = b[1] - a[1], L = vx * vx + vy * vy || 1;
    const s = clamp01(((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / L);
    return Math.hypot(p[0] - a[0] - vx * s, p[1] - a[1] - vy * s);
  }
  function hitTest(x, y, touch) {
    if (!canFold()) return false;
    const tol = touch ? 30 : 18;
    const h = handleScreen();
    if (Math.hypot(x - h[0], y - h[1]) < tol) return true;
    if (guide.data.edge) {
      const a = toScreen(guide.data.edge[0]), b = toScreen(guide.data.edge[1]);
      if (distToSeg([x, y], a, b) < tol * 0.6) return true;
    }
    return false;
  }
  function mapPointer(x, y) {
    const tx = x - IC.grab[0], ty = y - IC.grab[1];
    const pts = guide.data.traj.map(toScreen);
    const N = pts.length - 1, cur = S.t * N, win = Math.ceil(0.2 * N);
    let best = Infinity, bt = S.t;
    for (let k = Math.max(0, Math.floor(cur) - win); k <= Math.min(N - 1, Math.ceil(cur) + win); k++) {
      const a = pts[k], b = pts[k + 1];
      const vx = b[0] - a[0], vy = b[1] - a[1], L = vx * vx + vy * vy || 1e-6;
      const s = clamp01(((tx - a[0]) * vx + (ty - a[1]) * vy) / L);
      const d = Math.hypot(tx - a[0] - vx * s, ty - a[1] - vy * s);
      const tt = (k + s) / N;
      const score = d + Math.abs(tt - S.t) * 45;
      if (score < best) { best = score; bt = tt; }
    }
    S.t = bt;
  }

  glCanvas.addEventListener('pointerdown', (e) => {
    glCanvas.setPointerCapture(e.pointerId);
    IC.pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (IC.pts.size === 2) { // pinch zoom
      const [a, b] = [...IC.pts.values()];
      IC.pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); IC.orbit = null;
      return;
    }
    const touch = e.pointerType === 'touch';
    if (hitTest(e.clientX, e.clientY, touch)) {
      const h = handleScreen();
      IC.grab = [e.clientX - h[0], e.clientY - h[1]];
      S.mode = 'drag';
      camCtl.wGoal = 1;
      glCanvas.style.cursor = 'grabbing';
      ui.hint.hidden = true;
    } else {
      IC.orbit = [e.clientX, e.clientY];
      camCtl.spin = 0;
    }
  });
  glCanvas.addEventListener('pointermove', (e) => {
    if (IC.pts.has(e.pointerId)) IC.pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (IC.pinch && IC.pts.size === 2) {
      const [a, b] = [...IC.pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      camCtl.zoom(IC.pinch / d); IC.pinch = d; return;
    }
    if (S.mode === 'drag') {
      mapPointer(e.clientX, e.clientY);
      if (S.t >= 0.94) { camCtl.wGoal = 0; finishFold(S.t); }
      return;
    }
    if (IC.orbit) {
      const dx = e.clientX - IC.orbit[0], dy = e.clientY - IC.orbit[1];
      IC.orbit = [e.clientX, e.clientY];
      camCtl.orbit(dx * 0.32, dy * 0.25);
      return;
    }
    const over = hitTest(e.clientX, e.clientY, e.pointerType === 'touch');
    guide.hoverGoal = over ? 1 : 0;
    glCanvas.style.cursor = over ? 'grab' : 'default';
  });
  const endPointer = (e) => {
    IC.pts.delete(e.pointerId);
    if (IC.pts.size < 2) IC.pinch = null;
    if (S.mode === 'drag') {
      camCtl.wGoal = 0;
      const pts = guide.data.traj, tgt = toScreen(pts[pts.length - 1]);
      const near = Math.hypot(e.clientX - IC.grab[0] - tgt[0], e.clientY - IC.grab[1] - tgt[1]) < 40;
      if (S.t >= 0.7 || near) finishFold(S.t); else returnFold(S.t);
      glCanvas.style.cursor = 'default';
    }
    IC.orbit = null;
  };
  glCanvas.addEventListener('pointerup', endPointer);
  glCanvas.addEventListener('pointercancel', endPointer);
  glCanvas.addEventListener('wheel', (e) => { e.preventDefault(); camCtl.zoom(Math.exp(e.deltaY * 0.0012)); }, { passive: false });

  /* ---------------- loop ---------------- */
  let last = performance.now(), clock = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
    runQueue(dt);
    if (S.cur && S.cur.kind === 'motion' && S.cur.step === S.i && S.mode !== 'drag') camCtl.wGoal = S.cur.to > S.cur.from ? 0.7 : 0.4;
    else if (S.mode !== 'drag') camCtl.wGoal = 0;
    camCtl.update(dt);
    stand.v += (stand.goal - stand.v) * (1 - Math.exp(-dt * 1.3));
    const sv = easeInOut(clamp01(stand.v));
    modelGroup.rotation.x = (Math.PI / 2) * sv;  // lift the model off the table so it stands on its legs' crease line
    modelGroup.position.set(0, 0.25 * sv, 0.3 * sv);
    const pose = currentPose();
    const pts = paper.update(pose);
    creaseR.update(pts, visibleCreases());
    guide.alpha += (guide.alphaGoal - guide.alpha) * (1 - Math.exp(-dt * 7));
    guide.hover += (guide.hoverGoal - guide.hover) * (1 - Math.exp(-dt * 12));
    renderer.render(scene, camera);
    guide.draw(clock, S.t, S.mode === 'drag');
    requestAnimationFrame(frame);
  }

  /* ---------------- boot (keeps progress across live updates) ---------------- */
  function start(data) {
    const deep = /^#step(\d+)$/.exec(location.hash || '');
    if (deep && data.i === undefined) data = { i: Math.max(0, Math.min(MODEL.total, +deep[1]) - 1), everFolded: true };
    const i = Math.min(data.i ?? 0, LIVE - 1);
    S.done = (data.done || []).slice();
    S.everFolded = !!data.everFolded;
    if (i > 0) { for (let j = 0; j < i; j++) S.done[j] = true; }
    S.i = i;
    if (isLive(i)) {
      setCamera(i, i > 0);
      if (!S.done[i]) { guide.build(i); queue([{ kind: 'wait', dur: i > 0 ? 0 : 0.9 }, { kind: 'call', fn: () => { guide.alphaGoal = 1; } }]); }
    } else setCamera(LIVE - 1, true);
    refreshUI();
    requestAnimationFrame((t) => { last = t; frame(t); });
  }
  window.claude?.hot?.snapshot?.(() => ({ i: S.i, done: S.done, everFolded: S.everFolded }));
  window.__crane = { S, engine, camCtl, guide, toScreen, next, prev };
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();

</script>

</body>
</html>
